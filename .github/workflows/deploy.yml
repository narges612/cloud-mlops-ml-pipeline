name: CI/CD - Azure Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name cloudmlopsregistry

      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 \
            -t cloudmlopsregistry.azurecr.io/cloud-mlops-ml-pipeline:${{ github.sha }} .
          docker push cloudmlopsregistry.azurecr.io/cloud-mlops-ml-pipeline:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name churn-prediction-api \
            --resource-group rg-cloud-mlops \
            --image cloudmlopsregistry.azurecr.io/cloud-mlops-ml-pipeline:${{ github.sha }}